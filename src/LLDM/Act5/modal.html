<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal</title>
    <link rel="stylesheet" href="modal.css">
</head>

<body>

    <h1>Ejemplo de ventana modal</h1>

    <!-- Enlace que abre el modal -->
    <a href="#modal" class="boton">Abrir modal</a>

    <!-- Ventana modal que aparece al pulsar el enlace -->
    <div id="modal">
        <div class="contenido">
            <h2>Ventana emergente</h2>
            <p>Esta es una ventana modal creada únicamente con HTML y CSS.</p>
            <a href="#" class="cerrar">Cerrar</a>
        </div>
    </div>

</body>

</html>
