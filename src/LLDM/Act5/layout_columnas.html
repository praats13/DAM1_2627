<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout de dos columnas</title>
    <link rel="stylesheet" href="layout_columnas.css">
</head>

<body>

    <div class="contenedor">
        <!-- Contenedor principal que agrupa las dos columnas -->
        <div class="columna columna1">
            <h2>Primera columna</h2>
            <p>Esta es la primera columna de la página. Aquí podemos añadir información sobre diferentes temas.</p>
        </div>

        <div class="columna columna2">
            <h2>Segunda columna</h2>
            <p>Esta es la segunda columna de la página. Aquí podemos añadir más información y contenido.</p>
        </div>
    </div>

</body>

</html>
