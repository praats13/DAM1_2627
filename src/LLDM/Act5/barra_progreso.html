<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra de progreso</title>
    <link rel="stylesheet" href="barra_progreso.css">
</head>
<body>

    <h1>Barras de progreso</h1>

    <!-- Cada barra representa un porcentaje diferente -->
    <h2>Progreso del 25%</h2>
    <div class="barra">
        <div class="progreso porcentaje25"></div>
    </div>

    <h2>Progreso del 50%</h2>
    <div class="barra">
        <div class="progreso porcentaje50"></div>
    </div>

    <h2>Progreso del 75%</h2>
    <div class="barra">
        <div class="progreso porcentaje75"></div>
    </div>

</body>
</html>
